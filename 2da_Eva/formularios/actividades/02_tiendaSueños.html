</head>
<body>
        <header>
            <h1>Tienda de sueños personalizados</h1>

        <main>
            <form>
                <!-- 
                    Nombre y correo del cliente;
                    Edad del cliente;
                    Fecha preferida para recibir el sueño;
                    Género del sueño deseado (Aventura, Romance, Acción, Misterio, etc..);
                    Opciones extra (utilizad varios checkbox para otras opciones extras que se os ocurra para un sueño)
                    Campo de selección para el nivel de intensidad del sueño ("Tranquilo", "Moderado", "Épico")
                    Botón para enviar
                -->
                <input type="submit" value="Enviar">
            </form>
        </main>
        <footer>
            <h3>Prometeo ASIR 2025</h3>
        </footer>
