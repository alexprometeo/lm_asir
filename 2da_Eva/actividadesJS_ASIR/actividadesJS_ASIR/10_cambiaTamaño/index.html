<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://framerusercontent.com/images/ywSqKhJlBxDEBikU41Tb4rlF50.png" rel="icon">
    <title>Cambiar Tamaño</title>
    <style>
		body {
			background: linear-gradient(90deg, #9ee325, #bff75e);
			display: flex;
			flex-direction: column;
			flex-wrap: nowrap;
			align-content: center;
			align-items: center;		
		}
		button {
			max-width: 120px;
			margin-bottom: 10px;
			padding: 5px;
			border-radius: 4px;
			border: 1px solid black;
			cursor: pointer;
			background-color: white;
			font-size: 14px;
			transition: all 0.3s ease-in-out;
		}
		button:hover {
			background-color: antiquewhite;
			font-size: 15px;
			font-weight: bolder;
		}
		#disminuir:hover {
			font-size: 12px;
		}

        #texto { font-size: 16px; }

        h1, h4{
            font-family: monospace;
            color: white;
            font-weight: lighter;
            font-size: 2.25rem;            
        }     		
    </style>
</head>
<body>
	<h1>Cambiar tamaño texto</h1>
    <p id="texto">Texto de prueba</p>
    <button id="aumentar">Aumentar</button>
    <button id="disminuir">Disminuir</button>
    <h4>Prometeo ASIR 2025 &copy</h4>

    <script>
        // JavaScript aquí
		// Al hacer click en "Aumentar" deberá aumentar el tamaño de texto, o, si hacemos click en "disminuir", deberá disminuir el tamaño de texto.
    </script>
</body>
</html>
