<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://framerusercontent.com/images/ywSqKhJlBxDEBikU41Tb4rlF50.png" rel="icon">
    <title>Agregar Elemento</title>
    <style>
		body {
			background: linear-gradient(90deg, #9ee325, #bff75e);
			display: flex;
			flex-direction: column;
			flex-wrap: nowrap;
			align-content: center;
			align-items: center;         
		}
        ul {
            list-style: none;
            margin: 0;
            margin-block: 0;
            margin-inline: 0;
            padding-inline: 0;
        }
        li {
            padding: 25px;
            background-color: burlywood;
            text-align: center;
            margin-bottom: 8px;
        }
		button {
			padding: 5px;
			border-radius: 4px;
			border: 1px solid black;
			cursor: pointer;
			background-color: white;
			font-size: 14px;
			transition: all 0.3s ease-in-out;
		}
		button:hover {
			background-color: antiquewhite;
			font-size: 15px;
			font-weight: bolder;
		} 
        
        h1, h4{
            font-family: monospace;
            color: white;
            font-weight: lighter;
            font-size: 2.25rem;            
        }           
    </style>    
</head>
<body>
    <h1>Agregar Elemento</h1>    
    <ul id="lista">
        <li>Elemento 1</li>
        <li>Elemento 2</li>
    </ul>
    <button id="agregar">Agregar elemento</button>
    <h4>Prometeo ASIR 2025 &copy</h4>

		//Al hacer click en el botón, que agregue un elemento li a la lista

</body>
</html>
